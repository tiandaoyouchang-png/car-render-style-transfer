name: Validate Wondful

on:
  pull_request:
  push:
    branches:
      - main
      - "wondful-*"

jobs:
  python-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python sources
        run: python -m compileall -q wondful_ai_renderer tests
      - name: Run pure Python semantic tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
